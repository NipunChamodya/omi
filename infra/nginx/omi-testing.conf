# Standalone template rendered by infra/scripts/config.mjs; never included globally.
worker_processes 1;
daemon off;
pid "@RUNTIME@/nginx.pid";
error_log stderr crit;
events { worker_connections 256; }
http {
    include "@MIME_TYPES@";
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    client_max_body_size 5m;
    client_body_temp_path "@RUNTIME@/body";
    proxy_temp_path "@RUNTIME@/proxy";
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    map $http_upgrade $omi_upgrade {
        default close;
        ~*^websocket$ upgrade;
    }
    map "@PUBLIC_SCHEME@" $omi_hsts {
        default "";
        https "max-age=86400";
    }
    # cloudflared is local; Cloudflare overwrites CF-Connecting-IP at the edge.
    # Direct local processes are within this machine's trust boundary.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    server {
        listen 127.0.0.1:@PROXY_PORT@ default_server;
        server_name _;
        return 404;
    }
    server {
        listen 127.0.0.1:@PROXY_PORT@;
        server_name @PUBLIC_HOST@;
        root "@STATIC_ROOT@";
        disable_symlinks on;
        add_header X-Content-Type-Options nosniff always;
            add_header Strict-Transport-Security $omi_hsts always;
            add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        # Complements the build's single full meta policy; no script directive here.
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        location ~ (^|/)\. { return 404; }
        location ~* \.(?:map|sqlite(?:-wal|-shm)?|db|ts|tsx|pem|key|conf|env|sh)$ { return 404; }
        location ~ ^/(?:@|src(?:/|$)|node_modules(?:/|$)|test-fixtures(?:/|$)|docs(?:/|$)|infra(?:/|$)|apps(?:/|$)|packages(?:/|$)) { return 404; }
        location ~ "^/api/(?:health|transport/session|auth/(?:session|google/start|google/callback|logout)|profile(?:/avatar(?:/remove)?)?|rooms(?:/(?:preview|snapshot|join)|/[a-f0-9-]{36}/(?:snapshot|ws|voice/(?:config|ws)|social/ws)|/[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{8}/preview)?|avatars/[a-f0-9-]{36}/(?:profile|thumbnail)\.webp)$" {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:@BACKEND_PORT@;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $omi_upgrade;
            proxy_set_header Host @PUBLIC_HOST@;
            proxy_set_header X-Forwarded-Host @PUBLIC_HOST@;
            proxy_set_header X-Forwarded-Proto @PUBLIC_SCHEME@;
            # Overwrite, never append the visitor's forwarded header chain.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header CF-Connecting-IP "";
            proxy_read_timeout 90s;
            proxy_send_timeout 30s;
            proxy_connect_timeout 5s;
            proxy_buffering off;
            proxy_cache off;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Cache-Control;
            gzip off; # Never compress credential-bearing API responses.
            proxy_max_temp_file_size 0;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            add_header Strict-Transport-Security $omi_hsts always;
            add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
            add_header Referrer-Policy no-referrer always;
        }
        location /api { return 404; }
        # Root worker must revalidate; never give it immutable asset caching.
        location = /manifest.webmanifest {
            try_files $uri =404;
            default_type application/manifest+json;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Strict-Transport-Security $omi_hsts always;
            add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        }
        location = /sw.js {
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Strict-Transport-Security $omi_hsts always;
            add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        }
        location /assets/ {
            try_files $uri =404;
            # Hashed Vite assets only; NGINX child headers repeat protection.
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header Strict-Transport-Security $omi_hsts always;
            add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        }
        location / {
            try_files $uri /index.html;
            add_header Cache-Control no-cache always;
            add_header X-Content-Type-Options nosniff always;
            add_header Strict-Transport-Security $omi_hsts always;
            add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
    }
}
