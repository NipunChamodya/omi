<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title description">
  <title id="title">OMI — Four friends. One table.</title>
  <desc id="description">Emerald and gold OMI banner with three illustrated playing cards. A Sri Lankan card game for four players in two teams.</desc>
  <defs>
    <radialGradient id="felt" cx="77%" cy="45%" r="85%"><stop stop-color="#205341"/><stop offset="1" stop-color="#082b24"/></radialGradient>
    <linearGradient id="paper" x2="0.9" y2="1"><stop stop-color="#fffdf1"/><stop offset="1" stop-color="#e9e3cc"/></linearGradient>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#e4c47e" opacity="0.08"/></pattern>
    <filter id="shadow" x="-60%" y="-40%" width="220%" height="220%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#001a13" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="1280" height="480" rx="24" fill="url(#felt)"/>
  <rect width="1280" height="480" rx="24" fill="url(#grain)"/>
  <rect x="16" y="16" width="1248" height="448" rx="17" fill="none" stroke="#e4c47e" stroke-opacity="0.23"/>
  <ellipse cx="1030" cy="245" rx="275" ry="183" fill="none" stroke="#e4c47e" stroke-opacity="0.11"/>
  <ellipse cx="1030" cy="245" rx="245" ry="155" fill="none" stroke="#e4c47e" stroke-opacity="0.08"/>
  <g font-family="Georgia, 'Times New Roman', serif">
    <rect x="64" y="54" width="42" height="47" rx="12" fill="none" stroke="#e4c47e" stroke-opacity="0.55"/>
    <text x="85" y="88" text-anchor="middle" font-size="33" fill="#e4c47e">♠</text>
    <text x="122" y="88" fill="#faf6e8" font-size="36" letter-spacing="5">OMI</text>
    <text x="64" y="195" fill="#faf6e8" font-size="65" font-weight="bold" letter-spacing="-2">Four friends.</text>
    <text x="64" y="266" fill="#e4c47e" font-size="65" font-style="italic" letter-spacing="-2">One table.</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="314" fill="#c0d7c9" font-size="19">A Sri Lankan tradition. A little friendly rivalry.</text>
    <text x="64" y="342" fill="#c0d7c9" font-size="19">Good company, wherever you are.</text>
    <rect x="64" y="382" width="102" height="30" rx="15" fill="#e4c47e" fill-opacity="0.11" stroke="#e4c47e" stroke-opacity="0.22"/>
    <rect x="178" y="382" width="93" height="30" rx="15" fill="#e4c47e" fill-opacity="0.11" stroke="#e4c47e" stroke-opacity="0.22"/>
    <rect x="283" y="382" width="151" height="30" rx="15" fill="#e4c47e" fill-opacity="0.11" stroke="#e4c47e" stroke-opacity="0.22"/>
    <g fill="#e4c47e" text-anchor="middle" font-size="12" letter-spacing="1"><text x="115" y="402">4 PLAYERS</text><text x="224" y="402">2 TEAMS</text><text x="358" y="402">REAL-TIME PLAY</text></g>
    <text x="1208" y="414" fill="#a6c6b5" font-size="11" letter-spacing="3" text-anchor="end">THE SRI LANKAN TABLE</text>
  </g>
  <g filter="url(#shadow)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">
    <g transform="translate(794 150) rotate(-18 75 112)">
      <rect width="150" height="224" rx="12" fill="url(#paper)"/><rect x="7" y="7" width="136" height="210" rx="7" fill="none" stroke="#d2c392"/>
      <g fill="#15483b"><text x="17" y="39" font-size="29">K</text><text x="20" y="66" font-size="25">♠</text><text x="75" y="150" text-anchor="middle" font-size="93">♠</text></g>
    </g>
    <g transform="translate(923 110) rotate(4 75 112)">
      <rect width="150" height="224" rx="12" fill="url(#paper)"/><rect x="7" y="7" width="136" height="210" rx="7" fill="none" stroke="#d2c392"/>
      <g fill="#ad343d"><text x="17" y="39" font-size="29">A</text><text x="20" y="66" font-size="25">♥</text><text x="75" y="150" text-anchor="middle" font-size="87">♥</text></g>
    </g>
    <g transform="translate(1047 158) rotate(20 75 112)">
      <rect width="150" height="224" rx="12" fill="url(#paper)"/><rect x="7" y="7" width="136" height="210" rx="7" fill="none" stroke="#d2c392"/>
      <g fill="#15483b"><text x="17" y="39" font-size="29">Q</text><text x="20" y="66" font-size="25">♣</text><text x="75" y="150" text-anchor="middle" font-size="93">♣</text></g>
    </g>
  </g>
</svg>
